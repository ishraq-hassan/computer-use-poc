[project]
name = "computer-use-poc"
version = "0.1.0"
description = "Computer Use API proof-of-concept (OpenAI + Gemini) with cost comparison"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.70.0",
    "google-genai>=1.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pynput>=1.7.7",
    "pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "pyobjc>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
cua-poc = "src_mac_gpt.main:cli"
cua-poc-gemini = "src_mac_gemini.main:cli"
cua-poc-win = "src_windows_gpt.main:cli"
cua-poc-win-gemini = "src_windows_gemini.main:cli"
cua = "src_windows.main:cli"
